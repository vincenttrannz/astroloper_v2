---
# Baseline packages / users / /etc/hosts entry.
# Skipped on macOS (Homebrew stack is expected to be user-managed).

- name: Detect OS family
  ansible.builtin.set_fact:
    _skip_common: "{{ ansible_facts['os_family'] not in ['Debian', 'RedHat'] }}"

- name: Skip common role on non-Linux hosts
  ansible.builtin.debug:
    msg: "OS family {{ ansible_facts['os_family'] }} - skipping common role"
  when: _skip_common

- when: not _skip_common
  block:
    - name: Ensure baseline packages are installed (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3
          - python3-pip
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'
      become: true

    - name: Ensure baseline packages are installed (RedHat)
      ansible.builtin.dnf:
        name:
          - ca-certificates
          - curl
          - python3
          - python3-pip
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
      become: true

- name: Ensure /etc/hosts contains {{ domain }}
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+{{ domain | regex_escape }}$'
    line: "127.0.0.1  {{ domain }}"
    state: present
  become: true
  when:
    - domain is defined
    - env_name == 'development'
