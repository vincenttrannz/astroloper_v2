---
# Deploy the astroloper compose stack for a given environment.

- name: Ensure project root exists
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory
    mode: "0755"
  when: env_name != 'development'
  become: true

# Render the per-environment .env files. Compose reads the top-level .env for
# ${VAR} interpolation and injects backend/.env + frontend/.env into the
# containers via each service's `env_file:`. This is the single config path for
# every environment (no inline `environment:` block below).
- name: Render top-level .env for the environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ playbook_dir }}/../../.env"
    mode: "0640"

- name: Render backend/.env for the environment
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ playbook_dir }}/../../backend/.env"
    mode: "0640"

- name: Render frontend/.env for the environment
  ansible.builtin.template:
    src: frontend.env.j2
    dest: "{{ playbook_dir }}/../../frontend/.env"
    mode: "0640"

- name: Build and start the compose stack
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose {{ compose_files | map('regex_replace', '^(.*)$', '-f \1') | join(' ') }} \
      up -d --build
  args:
    chdir: "{{ playbook_dir }}/../.."
    executable: /bin/bash

- name: Run Django migrations
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose {{ compose_files | map('regex_replace', '^(.*)$', '-f \1') | join(' ') }} \
      exec -T backend python manage.py migrate --noinput
  args:
    chdir: "{{ playbook_dir }}/../.."
    executable: /bin/bash
