[defaults]
inventory = inventories/development
roles_path = roles
collections_path = ./collections
host_key_checking = False
stdout_callback = yaml
bin_ansible_callbacks = True
retry_files_enabled = False
interpreter_python = auto_silent

# Each environment has its own vault password file. Encrypt with
#   ansible-vault encrypt --vault-id <env>@vault_passwords/<env> <file>
# and Ansible will pick the matching identity automatically at decrypt time.
vault_identity_list = development@vault_passwords/development,staging@vault_passwords/staging,production@vault_passwords/production

[privilege_escalation]
become = false
become_method = sudo

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
