---
# Deploy the astroloper stack.
#
# Usage:
#   ansible-playbook playbooks/deploy.yml
#   ansible-playbook -i inventories/staging playbooks/deploy.yml

- name: Deploy the astroloper stack
  hosts: all
  gather_facts: true
  vars_files:
    - ../all.yml
    # Env-specific vars/vault. group_vars auto-discovery only works for
    # ad-hoc / ansible-inventory runs (they use the CWD as basedir); for
    # ansible-playbook the basedir is the playbook dir, so group_vars/<env>
    # is never found. Load it explicitly. `target_env` is passed by the
    # Taskfile (-e target_env=<env>) and defaults to development.
    - "../group_vars/{{ target_env | default('development') }}/vars.yml"
    - "../group_vars/{{ target_env | default('development') }}/vault.yml"
  tasks:
    - name: Ensure the external Traefik network `{{ traefik_network }}` exists
      ansible.builtin.command: docker network inspect {{ traefik_network }}
      register: _net_check
      ignore_errors: true
      changed_when: false

    - name: Create the external Traefik network
      ansible.builtin.command: docker network create {{ traefik_network }}
      when: _net_check.rc != 0

  roles:
    - role: app
