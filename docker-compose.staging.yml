# =========================================================================
# Staging overrides.
# Built images, gunicorn + next start, no bind mounts.
# Uses ${SITE_HOST} from the environment (e.g. staging.example.com).
# =========================================================================

services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.staging
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -

  frontend:
    command: node server.js
    environment:
      NODE_ENV: production
