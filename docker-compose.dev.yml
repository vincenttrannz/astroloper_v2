# =========================================================================
# Dev overrides:
#   - bind mount source for hot reload
#   - use Dockerfile.dev (runserver / next dev)
#   - default DJANGO_SETTINGS_MODULE to project.settings.dev
#   - no host port publishing; everything reachable via Traefik on
#     https://${SITE_HOST}
#   - Mailpit captures every outbound email; UI at
#     https://mailpit.${SITE_HOST}
# =========================================================================

services:
  backend:
    build:
      dockerfile: docker/Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      mailpit:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.dev
      DJANGO_DEBUG: "1"
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/static_collected

  frontend:
    build:
      dockerfile: docker/Dockerfile.dev
    command: npm run dev
    environment:
      NODE_ENV: development
      WAGTAIL_API_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://astroloper.localhost}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      - traefik.http.routers.astroloper-mailpit.rule=Host(`mailpit.${SITE_HOST:-astroloper.localhost}`)
      - traefik.http.routers.astroloper-mailpit.entrypoints=${TRAEFIK_ENTRYPOINT:-https}
      - traefik.http.routers.astroloper-mailpit.tls=${TRAEFIK_TLS:-true}
      - traefik.http.services.astroloper-mailpit.loadbalancer.server.port=8025

volumes:
  mailpit_data:
